[project]
name = "abc-bot-paper-trader"
version = "0.1.0"
description = "Paper-data-only validation collector for the ABC Bot stack. Collects market data from an MQL5 bridge and stores it in SQLite; live trading and order execution are forbidden."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["collector", "shared"]

[tool.hatch.build.targets.wheel.force-include]
"shared/schemas" = "shared/schemas"

[dependency-groups]
dev = [
    "jsonschema>=4.20",
    "mypy>=1.10",
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["mql5-bridge"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true